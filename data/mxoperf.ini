; mxoperf.dll settings. 1 = on, 0 = off. Missing keys = off.
[mxoperf]
; on-screen FPS readout, top-left (Ctrl+Alt+O also toggles it in game)
overlay=0
; count draw / state / texture / SWVP calls per frame (small overhead; for testing)
counters=0
; with a capture (Ctrl+Alt+P), also write every frame time to mxoperf_<date>.csv
csv=0
overlay_x=8
overlay_y=8
; frame cap while the game has focus (0 = no cap), e.g. 144 or 240
fps_cap=0
; frame cap while alt-tabbed (0 = same as fps_cap), e.g. 15 to save power / heat
bg_fps_cap=0
; keep the render thread on the fastest cores (Intel 12th gen+ P-cores, AMD X3D cache CCD); 0 = Windows decides
pin_fast_cores=0
