# DXVK settings (this file sits in the game folder, which is the game's working folder)
d3d9.maxFrameLatency = 1
d3d9.presentInterval = 0
d3d9.samplerAnisotropy = 16
# dxvk.hud = fps,frametimes,gpuload,api

# The game is 32-bit and the Rejacked launcher starts it without the 4 GB (large address aware) flag, so it
# has 2 GB of address space, and at high resolutions it can run out (crash or freeze). These keep DXVK's share down.
d3d9.textureMemory = 16
dxvk.trackPipelineLifetime = True
dxvk.numCompilerThreads = 2
